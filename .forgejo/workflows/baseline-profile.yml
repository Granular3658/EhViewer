name: Baseline profile generation

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - 'benchmark/**'
      - '.github/workflows/baseline-profile.yml'

jobs:
  baseline-profile:
    runs-on: nekomoee
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Setup Android SDK
        uses: https://github.com/android-actions/setup-android@v4

      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-10-07
          targets: aarch64-linux-android, thumbv7neon-linux-androideabi

      - name: Rust Cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: "./app/src/main/rust"

      - name: CMake Cache
        uses: actions/cache/restore@v5
        with:
          path: app/.cxx
          key: cmake-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          cache-read-only: true

      - name: Generate Baseline Profile
        run: ./gradlew generateBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: reports
          path: benchmark/build/reports
